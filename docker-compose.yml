# Local stack: one SQL Server holding a database per service, a one-off job
# that creates those databases and logins, the two services, and the static UI.
#
#   docker compose up --build
#
# The passwords below are local-development defaults for a database that only
# listens on this machine. They are not used on Azure, where each password is a
# GitHub Actions secret passed to Container Apps as a secret. To use your own,
# put MSSQL_SA_PASSWORD, CATALOG_DB_PASSWORD and ORDERS_DB_PASSWORD in a .env
# file next to this one (it is gitignored); compose reads it automatically.
name: small-shop

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # no arm64 image; Docker Desktop runs it under Rosetta
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Sa_Pass1}
    ports:
      - "127.0.0.1:14330:1433" # host access for inspecting data; localhost only
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Runs db/init.sql once per `up`, then exits. The script is idempotent.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_Sa_Pass1}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-LocalDev_Catalog_1}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-LocalDev_Orders_1}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /db/init.sql"]
    restart: "no"

  catalog:
    build: ./services/catalog
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      DATABASE_URL: mssql+pymssql://catalog_user:${CATALOG_DB_PASSWORD:-LocalDev_Catalog_1}@mssql:1433/catalog_db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      CORS_ORIGINS: http://localhost:8180
    ports:
      - "8101:8000"

  orders:
    build: ./services/orders
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      DATABASE_URL: mssql+pymssql://orders_user:${ORDERS_DB_PASSWORD:-LocalDev_Orders_1}@mssql:1433/orders_db
    ports:
      - "8102:8000"

  # Stock web server with ui/ mounted read-only; not a service container.
  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8180:80"

volumes:
  mssql-data:
