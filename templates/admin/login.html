{% extends "base.html" %}
{% block title %}Admin login | Small Shop{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Admin login</h1>
    <p>Enter the shop admin password to manage products.</p>
    <form method="post">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
