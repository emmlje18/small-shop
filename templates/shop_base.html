<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Small Shop{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('catalog.product_list') }}">Small Shop</a>
    <nav class="shop-navigation">
      <a class="topbar-link" href="{{ url_for('shop.cart') }}">Cart ({{ session.get('cart', [])|length }})</a>
      <a class="topbar-link" href="{{ url_for('admin.login') }}">Admin</a>
    </nav>
  </header>
  <main class="page shop-page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="message {{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
