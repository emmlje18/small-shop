openapi: 3.0.3
info:
  title: Orders service
  version: "1.0.0"
  description: |
    Cart pricing, checkout and orders for Emma's cool shop.

    The cart is kept by the browser as `[{"variant_id": 4, "qty": 2}]` and sent
    with each request. Cart and checkout read live prices and stock from the
    catalog service over HTTP (`GET /internal/variants/{id}`,
    `POST /internal/variants/{id}/decrement`, `POST /internal/variants/{id}/restore`,
    see services/catalog/openapi.yaml). When the catalog cannot be reached they
    answer 503; reading an existing order still works.

    Money is always integer cents. Errors are `{"error": "<message>"}`.
servers:
  - url: http://localhost:8102
    description: Local docker compose
tags:
  - name: cart
  - name: orders
  - name: operations

paths:
  /health:
    get:
      tags: [operations]
      summary: Whether this service can write and read its own database
      description: Does not depend on the catalog being up.
      operationId: health
      responses:
        "200":
          description: Database reachable for writes and reads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /cart/summary:
    post:
      tags: [cart]
      summary: Price a cart with current catalog prices and stock
      operationId: cartSummary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartRequest" }
      responses:
        "200":
          description: Priced lines; options no longer for sale are left out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /cart/add:
    post:
      tags: [cart]
      summary: Add units of an option, merging with an existing line
      operationId: cartAdd
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartChange" }
      responses:
        "200":
          description: The updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /cart/update:
    post:
      tags: [cart]
      summary: Set a line's quantity; 0 removes the line
      operationId: cartUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartChange" }
      responses:
        "200":
          description: The updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /checkout:
    post:
      tags: [orders]
      summary: Reserve stock in the catalog, save the order and charge the fake card
      description: Cards ending in 0000 are declined; the reserved stock is given back and the order is cancelled.
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201":
          description: Paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402":
          description: Payment declined; stock given back, order cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/CheckoutResult"
        "503": { $ref: "#/components/responses/CatalogUnavailable" }

  /orders/{orderId}:
    get:
      tags: [orders]
      summary: An order and its items, for the confirmation page
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: email
          in: query
          required: true
          description: The email used at checkout (case-insensitive).
          schema: { type: string }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  responses:
    BadRequest:
      description: Invalid input, not enough stock, or an item sold out
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or the email does not match
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CatalogUnavailable:
      description: The catalog could not be reached or timed out; nothing was charged
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Health:
      type: object
      required: [status, db, version]
      properties:
        status: { type: string, enum: [ok, error] }
        db: { type: string, enum: [ok, unavailable] }
        version: { type: string }
    CartLine:
      type: object
      required: [variant_id, qty]
      properties:
        variant_id: { type: integer, minimum: 1 }
        qty: { type: integer, minimum: 1 }
    CartRequest:
      type: object
      properties:
        cart:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
    CartChange:
      type: object
      required: [variant_id, quantity]
      properties:
        cart:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        variant_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 0 }
    CartResponse:
      type: object
      required: [cart]
      properties:
        cart:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
    CartSummary:
      type: object
      required: [items, total_cents]
      properties:
        total_cents: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [variant_id, product_name, option_label, unit_price_cents, stock, quantity, line_total_cents, has_enough_stock]
            properties:
              variant_id: { type: integer }
              product_name: { type: string }
              option_label: { type: string }
              unit_price_cents: { type: integer }
              stock: { type: integer }
              quantity: { type: integer }
              line_total_cents: { type: integer }
              has_enough_stock: { type: boolean }
    CheckoutRequest:
      type: object
      required: [cart, customer_name, customer_email, card_number]
      properties:
        cart:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CartLine" }
        customer_name: { type: string }
        customer_email: { type: string }
        card_number: { type: string, description: Never stored. }
    CheckoutResult:
      type: object
      required: [order_id, status]
      properties:
        order_id: { type: integer }
        status: { type: string, enum: [paid, cancelled] }
    OrderItem:
      type: object
      required: [variant_id, product_name, option_label, unit_price_cents, quantity]
      properties:
        variant_id: { type: integer }
        product_name: { type: string }
        option_label: { type: string }
        unit_price_cents: { type: integer }
        quantity: { type: integer }
    Order:
      type: object
      required: [id, customer_name, status, total_cents, created_at, items]
      properties:
        id: { type: integer }
        customer_name: { type: string }
        status: { type: string, enum: [pending, paid, shipped, cancelled] }
        total_cents: { type: integer }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
