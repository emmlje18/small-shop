name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write # needed to push images to GHCR with GITHUB_TOKEN

jobs:
  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders]
    env:
      # Push only for a push to main; PRs and other branches just build.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/small-shop-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
